[project]
name = "ambient-expense-agent"
version = "0.1.0"
description = "An Ambient Expense Agent built with Google ADK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.3.0",
    "fastapi",
    "uvicorn",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expense_agent"]

